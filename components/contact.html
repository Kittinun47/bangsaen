<section id="contact" class="bg-light py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow p-4">
                    <h3 class="text-center mb-3 fw-bold">✉️ ติดต่อสอบถามเพิ่มเติม</h3>
                    <form id="contactForm">
                        <div class="mb-3">
                            <label for="name" class="form-label">ชื่อ-นามสกุล</label>
                            <input type="text" class="form-control" id="name" placeholder="กรอกชื่อของคุณ" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">อีเมล</label>
                            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label">ข้อความ</label>
                            <textarea class="form-control" id="message" rows="3" placeholder="พิมพ์ข้อความที่ต้องการสอบถาม..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100">ส่งข้อความ</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
