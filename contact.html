<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ติดต่อเรา - แนะนำสถานที่ท่องเที่ยวบางแสน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="container py-5 mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow border-0 p-4 p-md-5">
                    <div class="text-center mb-4">
                        <span class="badge bg-primary mb-2 px-3 py-2">Get in Touch</span>
                        <h1 class="fw-bold">ติดต่อสอบถามข้อมูล</h1>
                        <p class="text-muted">กรอกข้อมูลของคุณเพื่อให้เราติดต่อกลับ หรือสอบถามข้อมูลการท่องเที่ยวเพิ่มเติม</p>
                    </div>

                    <!-- ฟอร์มติดต่อตามข้อกำหนด -->
                    <form id="contactForm">
                        <div class="mb-3">
                            <label for="name" class="form-label fw-bold">ชื่อ-นามสกุล</label>
                            <input type="text" class="form-control" id="name" placeholder="กรอกชื่อ-นามสกุลของคุณ" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label fw-bold">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="phone" class="form-label fw-bold">เบอร์โทรศัพท์</label>
                                <input type="tel" class="form-control" id="phone" placeholder="0812345678" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="subject" class="form-label fw-bold">หัวข้อ</label>
                            <input type="text" class="form-control" id="subject" placeholder="เช่น สอบถามเรื่องที่พัก หรือสถานที่ท่องเที่ยว" required>
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label fw-bold">รายละเอียด</label>
                            <textarea class="form-control" id="message" rows="4" placeholder="พิมพ์ข้อความรายละเอียดที่ต้องการสอบถาม..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2 fw-bold">ส่งข้อความ (Submit)</button>
                    </form>
                </div>

                <!-- ข้อมูลการติดต่อและแผนที่จำลอง -->
                <div class="mt-5 text-center">
                    <h4 class="fw-bold mb-3">ข้อมูลการติดต่อเพิ่มเติม</h4>
                    <p class="text-muted mb-1">📍 ที่ตั้ง: หาดบางแสน ตำบลแสนสุข อำเภอเมืองชลบุรี จังหวัดชลบุรี</p>
                    <p class="text-muted mb-1">📞 โทรศัพท์: 038-123-456</p>
                    <p class="text-muted">📧 อีเมล: contact@bangsaentravel.com</p>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
